<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0873b7">

  <title>GebäudeService AL – Preise Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f8;
      color: #17212b;
    }

    .header {
      background: linear-gradient(135deg, #075f99, #0b8bc4);
      color: white;
      padding: 22px 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.16);
    }

    .header-inner {
      max-width: 850px;
      margin: auto;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: .9;
      font-size: 14px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    .login-card {
      max-width: 460px;
      margin: 35px auto;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 12px 0 6px;
    }

    input {
      width: 100%;
      border: 1px solid #d5dde3;
      border-radius: 11px;
      padding: 13px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0873b7;
      box-shadow: 0 0 0 3px rgba(8,115,183,.10);
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      margin-top: 16px;
      background: #0873b7;
      color: white;
    }

    .primary:hover {
      background: #065f98;
    }

    .logout {
      background: #eef3f6;
      color: #17212b;
    }

    .save {
      background: #16863b;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .search {
      margin-bottom: 15px;
    }

    .price-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 3px 13px rgba(0,0,0,.06);
    }

    .service-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .price-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .price-label {
      font-size: 12px;
      color: #66727d;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .message {
      margin-top: 12px;
      padding: 11px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .success {
      display: block;
      background: #e7f7ec;
      color: #12672c;
    }

    .error {
      display: block;
      background: #fdebec;
      color: #9c1d25;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #66727d;
    }

    .hidden {
      display: none !important;
    }

    .small {
      color: #71808b;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      .container {
        padding: 12px;
      }

      .header h1 {
        font-size: 21px;
      }

      .price-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <h1>GebäudeService AL</h1>
      <p>Preisverwaltung</p>
    </div>
  </header>

  <main class="container">

    <section id="loginSection" class="card login-card">
      <h2>Admin Login</h2>

      <p class="small">
        Melden Sie sich an, um Preise zu bearbeiten.
      </p>

      <label for="email">E-Mail</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="E-Mail-Adresse"
      >

      <label for="password">Passwort</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Passwort"
      >

      <button id="loginBtn" class="primary">
        Anmelden
      </button>

      <div id="loginMessage" class="message"></div>
    </section>


    <section id="adminSection" class="hidden">

      <div class="topbar">
        <div>
          <strong>Preise bearbeiten</strong>
          <div class="small" id="userEmail"></div>
        </div>

        <button id="logoutBtn" class="logout">
          Abmelden
        </button>
      </div>

      <div class="card search">
        <input
          id="searchInput"
          type="search"
          placeholder="Leistung suchen..."
        >
      </div>

      <div id="loading" class="loading">
        Preise werden geladen...
      </div>

      <div id="pricesList"></div>

      <div id="globalMessage" class="message"></div>

    </section>

  </main>


<script>
  // ============================================
  // 1. HIER DEINE SUPABASE DATEN EINTRAGEN
  // ============================================
const SUPABASE_URL = "https://yhvatpwnxubogvgohwgh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_r8KH5pzNX7Ttk3K_6Z5sMw_cL-9ynam";


  // ============================================
  // 2. SUPABASE STARTEN
  // ============================================

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ============================================
  // ELEMENTE
  // ============================================

  const loginSection =
    document.getElementById("loginSection");

  const adminSection =
    document.getElementById("adminSection");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const loginMessage =
    document.getElementById("loginMessage");

  const globalMessage =
    document.getElementById("globalMessage");

  const pricesList =
    document.getElementById("pricesList");

  const loading =
    document.getElementById("loading");

  const searchInput =
    document.getElementById("searchInput");

  const userEmail =
    document.getElementById("userEmail");


  let prices = [];


  // ============================================
  // LOGIN
  // ============================================

  loginBtn.addEventListener("click", async () => {

    clearMessage(loginMessage);

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showMessage(
        loginMessage,
        "Bitte E-Mail und Passwort eingeben.",
        "error"
      );
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Anmeldung...";

    const { data, error } =
      await client.auth.signInWithPassword({
        email,
        password
      });

    loginBtn.disabled = false;
    loginBtn.textContent = "Anmelden";

    if (error) {
      showMessage(
        loginMessage,
        error.message,
        "error"
      );
      return;
    }

    showAdmin(data.user);
  });


  // ============================================
  // LOGOUT
  // ============================================

  logoutBtn.addEventListener("click", async () => {

    await client.auth.signOut();

    adminSection.classList.add("hidden");
    loginSection.classList.remove("hidden");

    pricesList.innerHTML = "";

    passwordInput.value = "";
  });


  // ============================================
  // SESSION PRÜFEN
  // ============================================

  async function checkSession() {

    const {
      data: { session }
    } = await client.auth.getSession();

    if (session && session.user) {
      showAdmin(session.user);
    }
  }


  // ============================================
  // ADMIN ANZEIGEN
  // ============================================

  async function showAdmin(user) {

    loginSection.classList.add("hidden");
    adminSection.classList.remove("hidden");

    userEmail.textContent = user.email || "";

    await loadPrices();
  }


  // ============================================
  // PREISE LADEN
  // ============================================

  async function loadPrices() {

    loading.classList.remove("hidden");
    pricesList.innerHTML = "";

    const { data, error } =
      await client
        .from("Prices")
        .select("id,service,price_min,price_max")
        .order("id", { ascending: true });

    loading.classList.add("hidden");

    if (error) {
      showMessage(
        globalMessage,
        "Fehler beim Laden: " + error.message,
        "error"
      );
      return;
    }

    prices = data || [];

    renderPrices(prices);
  }


  // ============================================
  // PREISE ANZEIGEN
  // ============================================

  function renderPrices(items) {

    pricesList.innerHTML = "";

    if (!items.length) {
      pricesList.innerHTML =
        '<div class="card">Keine Preise gefunden.</div>';
      return;
    }

    items.forEach(item => {

      const card = document.createElement("div");
      card.className = "price-card";

      card.innerHTML = `
        <div class="service-name">
          ${escapeHtml(item.service)}
        </div>

        <div class="price-grid">

          <div>
            <div class="price-label">
              Preis min.
            </div>

            <input
              type="number"
              step="0.01"
              inputmode="decimal"
              class="min-input"
              value="${item.price_min ?? ""}"
            >
          </div>

          <div>
            <div class="price-label">
              Preis max.
            </div>

            <input
              type="number"
              step="0.01"
              inputmode="decimal"
              class="max-input"
              value="${item.price_max ?? ""}"
            >
          </div>

        </div>

        <button class="save">
          Speichern
        </button>

        <div class="message row-message"></div>
      `;

      const minInput =
        card.querySelector(".min-input");

      const maxInput =
        card.querySelector(".max-input");

      const saveBtn =
        card.querySelector(".save");

      const rowMessage =
        card.querySelector(".row-message");


      saveBtn.addEventListener(
        "click",
        async () => {

          clearMessage(rowMessage);

          const min =
            Number(minInput.value.replace(",", "."));

          const max =
            Number(maxInput.value.replace(",", "."));

          if (
            !Number.isFinite(min) ||
            !Number.isFinite(max)
          ) {
            showMessage(
              rowMessage,
              "Bitte gültige Preise eingeben.",
              "error"
            );
            return;
          }

          if (min > max) {
            showMessage(
              rowMessage,
              "Der Mindestpreis darf nicht höher als der Maximalpreis sein.",
              "error"
            );
            return;
          }

          saveBtn.disabled = true;
          saveBtn.textContent = "Speichern...";

          const { data, error } =
            await client
              .from("Prices")
              .update({
                price_min: min,
                price_max: max
              })
            .eq("service", item.service)
.select("id, service, price_min, price_max");

          saveBtn.disabled = false;
          saveBtn.textContent = "Speichern";

          if (error) {
            showMessage(
              rowMessage,
              "Fehler: " + error.message,
              "error"
            );
            return;
          }

          if (!data || data.length === 0) {
  showMessage(
    rowMessage,
    "Fehler: Supabase hat keine Preiszeile geändert.",
    "error"
  );
  return;
}
          item.price_min = min;
          item.price_max = max;

          showMessage(
            rowMessage,
           "✓ Supabase: " + data[0].price_min + " / " + data[0].price_max,
            "success"
          );
        }
      );

      pricesList.appendChild(card);
    });
  }


  // ============================================
  // SUCHEN
  // ============================================

  searchInput.addEventListener("input", () => {

    const q =
      searchInput.value
        .trim()
        .toLowerCase();

    if (!q) {
      renderPrices(prices);
      return;
    }

    const filtered =
      prices.filter(item =>
        String(item.service)
          .toLowerCase()
          .includes(q)
      );

    renderPrices(filtered);
  });


  // ============================================
  // HILFSFUNKTIONEN
  // ============================================

  function showMessage(
    element,
    text,
    type
  ) {

    element.textContent = text;
    element.className =
      "message " + type;
  }


  function clearMessage(element) {

    element.textContent = "";
    element.className = "message";
  }


  function escapeHtml(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  checkSession();
</script>

</body>
</html>
